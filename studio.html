<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio · GitHub Heatmap 3D</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Turn your GitHub contribution graph into a 360° rotatable 3D model. Embed it on your website or GitHub README." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <header class="panel">
      <h1><a href="/" class="home">GitHub Heatmap <span>3D</span></a> <small class="studio-tag">Studio</small></h1>
      <form id="form">
        <input id="username" placeholder="GitHub username" autocomplete="off" spellcheck="false" />
        <select id="year"></select>
        <button type="submit">Load</button>
      </form>
      <div id="status"></div>
      <div class="player" id="player" hidden>
        <button type="button" id="playSong" class="play-btn" aria-label="Play your year as a song">▶</button>
        <div class="song-info">
          <div class="song-title"><span id="songTitle">Your song</span> <span class="pro-tag">PRO</span></div>
          <div class="song-meta" id="songMeta"></div>
          <input type="range" id="songSeek" min="0" max="364" value="0" aria-label="Song position" />
          <div class="song-meta"><span id="songTime">0:00</span> · <span id="songDay">press play</span></div>
        </div>
        <button type="button" id="downloadSong" class="icon-btn" title="Download song (WAV)" aria-label="Download song as WAV">⤓</button>
      </div>
    </header>

    <div class="panel stats" id="stats" hidden>
      <div class="big" id="total">0</div>
      <div class="muted" id="totalLabel">contributions</div>
      <div class="row"><span class="muted">Best day</span><span id="best">–</span></div>
      <div class="row"><span class="muted">Longest streak</span><span id="streak">–</span></div>
    </div>

    <div class="panel controls">
      <div class="styles" id="styles" role="radiogroup" aria-label="Style"></div>
      <div class="themes" id="themes" role="group" aria-label="Theme"></div>
      <label><input type="checkbox" data-opt="autoRotate" /> Auto-rotate</label>
      <label><input type="checkbox" data-opt="log" /> Log scale</label>
      <label class="slider">Height <input type="range" data-opt="height" min="2" max="20" /></label>
      <button id="resetView" type="button">Reset view</button>
      <button id="exportStl" type="button">Download STL</button>
      <div class="legend">Less <span id="legend" style="display: contents"></span> More</div>
      <button id="openDrawer" type="button" class="primary">Customize &amp; Embed</button>
    </div>

    <aside class="panel drawer" id="drawer" hidden aria-label="Customize and embed">
      <div class="drawer-head">
        <h2>Customize &amp; Embed</h2>
        <button type="button" id="closeDrawer" class="icon" aria-label="Close">✕</button>
      </div>

      <section>
        <h3>Look</h3>
        <label class="range">Bar size <input type="range" data-opt="barSize" min="0.3" max="1" step="0.02" /></label>
        <label><input type="checkbox" data-opt="shadows" /> Shadows</label>
        <label><input type="checkbox" data-opt="base" /> Base</label>
        <label><input type="checkbox" data-opt="labels" /> Month &amp; day labels</label>
        <label><input type="checkbox" data-opt="title" /> Name &amp; year</label>
        <label><input type="checkbox" data-opt="transparent" /> Transparent background</label>
      </section>

      <section>
        <h3>Motion</h3>
        <label class="range">Rotation speed <input type="range" data-opt="rotateSpeed" min="-5" max="5" step="0.1" /></label>
        <label><input type="checkbox" data-opt="interactive" /> Drag to rotate</label>
        <label><input type="checkbox" data-opt="zoom" /> Scroll to zoom</label>
        <label><input type="checkbox" data-opt="tooltip" /> Hover tooltips</label>
        <label><input type="checkbox" data-opt="music" /> "Play your year" button on embeds</label>
      </section>

      <section>
        <h3>Camera</h3>
        <p class="hint">Rotate and zoom the model to the angle you like, then save it as the starting view.</p>
        <div class="buttons">
          <button type="button" id="saveCamera">Save this view</button>
          <button type="button" id="clearCamera">Use default</button>
        </div>
        <p class="hint" id="cameraStatus"></p>
      </section>

      <section>
        <h3>Get the code</h3>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="website" aria-selected="true">Website</button>
          <button type="button" role="tab" data-tab="script">Script</button>
          <button type="button" role="tab" data-tab="readme">README</button>
          <button type="button" role="tab" data-tab="link">Link</button>
        </div>
        <p class="hint" id="tabHint"></p>
        <label class="field" id="readmeTypeField" hidden>Image <select id="readmeType"></select></label>
        <div class="size" id="sizeFields">
          <label>Width <input type="text" id="embedWidth" value="100%" /></label>
          <label>Height <input type="text" id="embedHeight" value="420" /></label>
        </div>
        <pre id="code"></pre>
        <div class="buttons">
          <button type="button" id="copy" class="primary">Copy code</button>
          <a id="previewLink" target="_blank" rel="noopener">Open preview ↗</a>
        </div>
        <img id="readmePreview" alt="README image preview" hidden />
      </section>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
